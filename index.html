<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
    <script>
      // Before the first paint: the prerendered HTML carries no theme, so a
      // stored dark choice would otherwise flash white on every load.
      try {
        var s = localStorage.getItem('nihongo-theme')
        if (s === 'dark' || ((!s || s === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
        if (localStorage.getItem('nihongo-furigana') === 'off') document.documentElement.classList.add('furigana-off')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
