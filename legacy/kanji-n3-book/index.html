<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N3 Kelime Çalışması — 1-35</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--paper:#ffffff;--ink:#1d2a44;--soft:#5d6a85;--line:#d5dbe7;--indigo:#2f4b8f;--red:#c8322b;--ok:#1f7a55;--okbg:#e3f3ec;--badbg:#fbe9e7;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--paper:#1b2336;--ink:#e6eaf3;--soft:#9aa6c0;--line:#2e3a55;--indigo:#8fa8ec;--red:#ef6a5f;--ok:#5fd0a0;--okbg:#173a2d;--badbg:#45201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121826;--paper:#1b2336;--ink:#e6eaf3;--soft:#9aa6c0;--line:#2e3a55;--indigo:#8fa8ec;--red:#ef6a5f;--ok:#5fd0a0;--okbg:#173a2d;--badbg:#45201d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.5}
.jp,.big,.sent,.opt{font-family:"Klee One","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:18px;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.back{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.toggle{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.toggle.on{border-color:var(--indigo);color:var(--indigo)}
button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
/* home */
.hero{text-align:center;padding:24px 0 10px}
.hero .big{font-size:64px;line-height:1;letter-spacing:.05em}
.hero p{color:var(--soft);margin:10px 0 0}
.menu{display:grid;gap:12px;margin-top:20px}
.mbtn{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.mbtn .k{font-family:"Klee One",sans-serif;font-size:34px;width:52px;text-align:center;color:var(--indigo)}
.mbtn b{display:block;font-size:17px}
.mbtn span{color:var(--soft);font-size:14px}
.grp{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}
h2{font-size:15px;color:var(--soft);margin:22px 0 4px;font-weight:600}
/* learn */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.word{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.word .big{font-size:52px;line-height:1.1}
.rd{font-family:"Klee One",sans-serif;font-size:22px;color:var(--indigo)}
.rd.hid{background:var(--line);color:transparent;border-radius:6px;cursor:pointer;user-select:none}
.mean{font-weight:700;font-size:19px;margin-top:4px}
.parts{display:grid;gap:6px;margin:12px 0}
.part{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
.part .jp{font-size:28px;width:36px;text-align:center}
.tip{border-left:3px solid var(--red);padding-left:10px;font-size:15px;margin:10px 0}
.sent{font-size:20px;line-height:2.2}
.tr{color:var(--soft);font-size:15px}
.navrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;gap:10px}
.navrow button{flex:1 1 140px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.navrow .pri{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}
ruby rt{font-size:.5em;color:var(--soft)}
.nofuri rt{visibility:hidden}
u.t{text-decoration:none;border-bottom:2px solid var(--red);padding:0 2px}
/* test */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin:6px 0 14px}
.qtype{font-size:14px;color:var(--soft);margin-bottom:6px}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ok)}
.dots i.f{background:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:22px;min-height:64px}
.opts.wide{grid-template-columns:1fr}.opts.wide .opt{font-size:17px;text-align:left;padding:12px 14px;line-height:1.9;min-height:0}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sec .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.sec .t b{font-size:17px}.sec .t span{color:var(--soft);font-size:14px}
.sec .b{display:flex;gap:8px;margin-top:10px}.sec .b button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}.sec .b .pri{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--red)}
.opt small{display:block;font-family:Figtree,sans-serif;font-size:12px;color:var(--soft)}
.fb{margin-top:14px;border-radius:14px;padding:14px;font-size:15px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb .head{font-weight:700;font-size:16px;margin-bottom:6px}
.done{text-align:center;padding:40px 0}
.stamp{display:inline-block;font-family:"Klee One",sans-serif;font-size:44px;color:var(--red);border:4px solid var(--red);border-radius:50%;width:110px;height:110px;line-height:100px;transform:rotate(-8deg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.credit{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:11px;line-height:1;color:var(--soft);background:var(--bg);padding:5px 16px calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
.credit a{color:var(--indigo);font-weight:600;text-decoration:none}
#app{padding-bottom:32px}
</style>
</head>

const RDT={en:{1:"On Sunday I went to a soccer match with a friend. When we arrived at the station there were already many spectators. My friend paid for the tickets; tax was added to the price. The players apparently train hard every day. After the match we had bean soup and talked about our common hobby.",2:"My town has a big port that exports fish abroad. In the evening my father crosses his arms and quietly watches the waves. He says he is satisfied with life here. The wind got cold, so we walked home quickly. That night I slept deeply, listening to the waves.",3:"My hometown is a farming town. The restaurant by the station used to be always empty. But I heard a rumor that a new chef had come, so I went to check if it was true. The dish's strong point was local vegetables. The chef was tall with good posture and looked scary, but was very kind. As my family ate around the table, the sun went down. Actually I had forgotten my reservation, but the staff forgave me. That's a secret from my mother.",4:"There was a party for international students. Of course people worry about life in Japan. But everyone's eyes were shining and they looked happy. We cooked so much that some food was left over. On the way home, crossing was prohibited on the short road. The bus had also left, so I was a bit disappointed.",5:"Next week I'm going to Osaka on business with my manager. While preparing, the meeting time suddenly changed. I moved in a hurry, so my knee hurts a little when I bend it. At night I read the documents while waiting for the water to boil. I was worried about failing, but a colleague comforted me: 'It'll be fine.'"},

 return `<div class="hero"><div class="big jp">漢字</div><p>${U().lead(D.length,SEC.length)}</p>${langBar()}</div>
 <div class="menu">${SEC.map(card).join("")}
 <button class="mbtn" onclick="startTest(0)" style="margin-top:6px"><span class="k">総</span><div><b>${U().all(D.length)}</b><span>${U().allS}</span></div></button>
 </div>`;
}
function read(){const k=secOf(S.lf),r=RD[S.lf],x=SEC[k];
 return hdr(`${secL(k+1)} · ${U().readT}`,furiBtn())+`<div class="card"><div class="tr">${x.from}–${x.to} ${U().words}</div>
 <h2 class="jp" style="font-size:22px;color:var(--ink);margin:6px 0 10px">${ruby(r.t)}</h2>
 <div class="sent ${S.furi?'':'nofuri'}">${r.j.map(ruby).join('<br>')}</div>
 <div class="tip" style="margin-top:14px">${LG==='tr'?r.tr:RDT[LG][S.lf]}</div></div>
 <div class="navrow"><button onclick="learnSec(${k})">${U().l}</button><button class="pri" onclick="startTest(${x.m})">${U().secTest}</button></div>`}
function learnSec(k){S.lf=SEC[k].m;S.li=0;go('learn')}
function learn(){
 const ids=pool(S.lf),i=ids[S.li],d=D[i];
 const parts=d.p.map((p,j)=>`<div class="part"><span class="jp">${p[0]}</span><div><b>${p[1]}</b><br>${PART(i,j)}</div></div>`).join("");
 return hdr(`${secL(secOf(S.lf)+1)} · ${S.li+1}/${ids.length}`,`<button class="toggle ${S.hide?'on':''}" onclick="S.hide=!S.hide;render()">${U().hide}</button>`)+
 `<div class="card"><div class="tr">${U().MT[d.m]} · #${i+1}</div>
 <div class="word"><span class="big jp">${d.w}</span><span class="rd ${S.hide?'hid':''}" onclick="this.classList.remove('hid')">${d.r}</span></div>
 <div class="mean">${MEAN(i)}</div>${parts?`<div class="parts">${parts}</div>`:""}
 <div class="tip">${TIP(S.view==="learn"?i:S.cur)}</div>
 <div class="sent">${ruby(d.m===5?d.o[d.a]:d.m===4?d.s+' → <b>'+d.o[d.a]+'</b>':d.s.replace(/（　）/,`<u class="t">${d.o[d.a]}</u>`))}</div><div class="tr">${TRN(S.view==="learn"?i:S.cur)}</div></div>
 <div class="navrow"><button onclick="S.li=Math.max(0,S.li-1);render()" ${S.li?'':'disabled'}>${U().prev}</button>
 ${S.li<ids.length-1?`<button class="pri" onclick="S.li++;render();scrollTo(0,0)">${U().next}</button>`:`<button onclick="go('read')">${U().readT}</button><button class="pri" onclick="startTest(S.lf)">${U().secTest}</button>${secOf(S.lf)<SEC.length-1?`<button onclick="learnSec(${secOf(S.lf)+1})">${U().nextSec}</button>`:''}`}</div>`;
}
function startTest(f){if(f!==undefined)S.tf=f;S.q=shuffle(pool(S.tf));S.c={};S.q.forEach(i=>S.c[i]=0);S.tries=0;S.wrong=0;next();go('test')}
function next(){S.cur=S.q.shift();S.ans=null;S.order=shuffle([0,1,2,3])}
function pick(k){if(S.ans!==null)return;S.ans=k;S.tries++;const d=D[S.cur];
 if(k===d.a){S.c[S.cur]++;if(S.c[S.cur]<2)S.q.splice(Math.min(S.q.length,4+Math.floor(Math.random()*4)),0,S.cur)}
 else{S.wrong++;S.q.splice(Math.min(S.q.length,2),0,S.cur)}render()}
function cont(){if(!S.q.length){go('done');return}next();render();scrollTo(0,0)}
function test(){
 const tot=Object.keys(S.c).length,m=Object.values(S.c).filter(v=>v>=2).length,d=D[S.cur],c=S.c[S.cur];
 const opts=S.order.map(k=>{let cl="";if(S.ans!==null){if(k===d.a)cl="ok";else if(k===S.ans)cl="bad"}
  return `<button class="opt ${cl}" onclick="pick(${k})">${ruby(d.o[k])}${S.ans!==null&&d.or&&d.or[k]!=="—"&&d.m!==1?`<small>${d.or[k]}</small>`:""}</button>`}).join("");
 let fb="";if(S.ans!==null){const ok=S.ans===d.a;
  fb=`<div class="fb ${ok?'ok':'bad'}"><div class="head">${ok?(S.c[S.cur]>=2?U().ok2:U().ok1):U().bad+ruby(d.o[d.a])}</div>
  <b class="jp" style="font-size:22px">${d.w}</b> <span class="rd">${d.r}</span> = <b>${MEAN(S.cur)}</b>
  <div class="tip">${TIP(S.view==="learn"?i:S.cur)}</div><div class="tr">${TRN(S.view==="learn"?i:S.cur)}</div></div>
  <div class="navrow"><button class="pri" onclick="cont()">${U().cont}</button></div>`}
 return hdr("Test",furiBtn())+`<div class="prog"><i style="width:${m/tot*100}%"></i></div>
 <div class="stat"><span>${U().doneN} ${m}/${tot}</span><span>${U().wrong} ${S.wrong}</span></div>
 <div class="card"><div class="qtype">${U().MT[d.m]}<span class="dots"><i class="${c>=1?'f':''}"></i><i class="${c>=2?'f':''}"></i></span></div>
 <div class="sent ${S.furi?'':'nofuri'}">${ruby(d.s)}</div>
 ${S.ans!==null?`<div class="tr">${TRN(S.view==="learn"?i:S.cur)}</div>`:""}
 <div class="opts ${d.m>=4?'wide':''} ${S.furi?'':'nofuri'}">${opts}</div></div>${fb}`;
}
function done(){return `<div class="done"><div class="stamp">合格</div><h1 style="margin-top:24px">${U().doneH}</h1>
 <p class="tr">${U().doneP(S.tries,S.wrong)}</p>
 <div class="navrow"><button onclick="go('home')">${U().menu.replace('← ','')}</button><button onclick="startTest()">${U().again}</button>${S.tf&&secOf(S.tf)<SEC.length-1?`<button class="pri" onclick="learnSec(${secOf(S.tf)+1})">${U().nextSec}</button>`:''}</div></div>`}
function render(){$.innerHTML=({home,learn,read,test,done})[S.view]()}
render();
</script>
</body>
</html>
