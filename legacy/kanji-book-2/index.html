<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji Book 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--paper:#fff;--ink:#1d2a44;--soft:#5d6a85;--line:#d5dbe7;--indigo:#2f4b8f;--red:#c8322b;--ok:#1f7a55;--okbg:#e3f3ec;--badbg:#fbe9e7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--paper:#1b2336;--ink:#e6eaf3;--soft:#9aa6c0;--line:#2e3a55;--indigo:#8fa8ec;--red:#ef6a5f;--ok:#5fd0a0;--okbg:#173a2d;--badbg:#45201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121826;--paper:#1b2336;--ink:#e6eaf3;--soft:#9aa6c0;--line:#2e3a55;--indigo:#8fa8ec;--red:#ef6a5f;--ok:#5fd0a0;--okbg:#173a2d;--badbg:#45201d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.5}
.jp,.opt.j{font-family:"Klee One","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:120px}
button{font:inherit;color:inherit;cursor:pointer}
.back,.toggle{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.toggle.on{border-color:var(--indigo);color:var(--indigo)}
button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.hero{text-align:center;padding:20px 0 6px}.hero .big{font-size:56px;line-height:1}.hero p{color:var(--soft);margin:8px 0 0}
.block{margin-top:20px}.block h2{font-size:15px;color:var(--soft);margin:0 0 8px;font-weight:600}
.unit{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.unit .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.unit .t b{font-size:16px}.unit .t span{color:var(--soft);font-size:13px}
.unit .ks{font-size:20px;letter-spacing:.15em;margin:6px 0;color:var(--indigo)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1 1 120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px}
.pri{background:var(--indigo)!important;color:var(--paper)!important;border-color:var(--indigo)!important}
.btest{width:100%;margin-top:4px;border:1px dashed var(--indigo);background:none;color:var(--indigo);border-radius:12px;padding:10px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.kh{display:flex;gap:16px;align-items:center}
.kh .k{font-size:64px;line-height:1;width:80px;text-align:center}
.kh .rd{font-size:14px;color:var(--soft)}.kh .rd b{color:var(--ink);font-weight:600}
.mean{font-weight:700;font-size:18px;margin-top:2px}
.words{margin-top:12px;display:grid;gap:6px}
.w{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:6px 12px}
.w .jp{font-size:22px;min-width:110px}
.w .m{font-size:15px}
ruby rt{font-size:.5em;color:var(--soft)}
.nofuri rt{visibility:hidden}
.hide{filter:blur(6px);cursor:pointer;user-select:none}
.num{color:var(--soft);font-size:13px}
.navrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.navrow button{flex:1 1 140px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin:6px 0 14px}
.qtype{font-size:14px;color:var(--soft);margin-bottom:6px}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ok)}.dots i.f{background:var(--ok)}
.qbig{font-size:56px;text-align:center;padding:10px 0}
.qmean{font-size:24px;font-weight:700;text-align:center;padding:16px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font-size:17px;min-height:60px}
.opt.j{font-size:22px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--red)}
.fb{margin-top:14px;border-radius:14px;padding:14px;font-size:15px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb .head{font-weight:700;margin-bottom:6px}
.done{text-align:center;padding:40px 0}
.stamp{display:inline-block;font-family:"Klee One",sans-serif;font-size:44px;color:var(--red);border:4px solid var(--red);border-radius:50%;width:110px;height:110px;line-height:100px;transform:rotate(-8deg)}
.credit{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:11px;line-height:1;color:var(--soft);background:var(--bg);padding:5px 16px calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
.credit a{color:var(--indigo);font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const K=[],UN=RAW.map(([t,tr,body],u)=>{const ids=[];
 body.trim().split("\n").forEach(l=>{const [k,on,kun,m,ws]=l.split("|");
  ids.push(K.length);K.push({k,on,kun,m,u,w:ws.split(",").map(x=>{const [w,r,mm]=x.split(":");return {w,r,m:mm}})})});
 return {t,tr,ids}});
const BL=[];for(let i=0;i<UN.length;i+=4)BL.push([...Array(Math.min(4,UN.length-i)).keys()].map(j=>i+j));

const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S={view:"home",u:0,furi:get("kb2_furi","1")==="1",blur:get("kb2_blur","1")==="1",open:{},scope:[],title:"",q:[],c:{},cur:null,type:0,opts:[],ans:null,tries:0,wrong:0};
const $=document.getElementById("app");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// tüm kelimeyi okunuşla ruby'le (kana kısmı da üstte görünür, okuması kolay)
const rb=(w,r)=>w===r?w:`<ruby>${w}<rt>${r}</rt></ruby>`;
const hdr=(t,x="")=>`<header><button class="back" onclick="go('home')">← Menü</button><h1>${t}</h1>${x}</header>`;
const tg=(k,l)=>`<button class="toggle ${S[k]?'on':''}" onclick="tog('${k}')">${l} ${S[k]?'açık':'kapalı'}</button>`;
function tog(k){S[k]=!S[k];put("kb2_"+k,S[k]?"1":"0");S.open={};render()}
function reveal(id){S.open[id]=1;render()}
const bl=(id,txt)=>S.blur&&!S.open[id]?`<span class="hide" onclick="reveal('${id}')">${txt}</span>`:txt;
function go(v){S.view=v;render();scrollTo(0,0)}

function home(){
 return `<div class="hero"><div class="big jp">漢字 2</div><p>${K.length} kanji · ${UN.length} ünite · önce öğren, sonra test</p></div>`+
 BL.map((b,bi)=>`<div class="block"><h2>Ünite ${b[0]+1}–${b[b.length-1]+1}</h2>`+
  b.map(u=>`<div class="unit"><div class="t"><b>${u+1}. ünite · <span class="jp">${UN[u].t}</span></b><span>${UN[u].ids.length} kanji</span></div>
   <div class="ks jp">${UN[u].ids.map(i=>K[i].k).join("")}</div>
   <div class="row"><button onclick="learn(${u})">学 Öğren</button><button class="pri" onclick="unitTest(${u})">試 Test</button></div></div>`).join("")+
  `<button class="btest" onclick="blockTest(${bi})">総 Ünite ${b[0]+1}–${b[b.length-1]+1} genel testi (${b.reduce((n,u)=>n+UN[u].ids.length,0)} kanji)</button></div>`).join("");
}
function learn(u){S.u=u;S.open={};go('study')}
function study(){const u=S.u,U=UN[u];
 const cards=U.ids.map((i,n)=>{const k=K[i];
  return `<div class="card"><div class="num">${u+1}.${n+1}</div><div class="kh"><div class="k jp">${k.k}</div>
   <div><div class="rd">音 <b class="jp">${k.on}</b> · 訓 <b class="jp">${k.kun}</b></div><div class="mean">${bl('k'+i,k.m)}</div></div></div>
   <div class="words">${k.w.map((w,j)=>`<div class="w"><span class="jp">${rb(w.w,w.r)}</span><span class="m">${bl('w'+i+'_'+j,w.m)}</span></div>`).join("")}</div></div>`}).join("");
 const nb=BL.findIndex(b=>b[b.length-1]===u);
 return hdr(`${u+1}. ünite · <span class="jp">${U.t}</span>`,tg('furi','ふりがな')+tg('blur','Anlam gizli'))+
 `<p class="num" style="margin-top:-6px">${U.tr}${S.blur?' · bulanık anlama dokun, açılsın':''}</p>
 <div class="${S.furi?'':'nofuri'}">${cards}</div>
 <div class="navrow"><button class="pri" onclick="unitTest(${u})">Bu ünitenin testi</button>
 ${nb>=0?`<button onclick="blockTest(${nb})">Ünite ${BL[nb][0]+1}–${u+1} genel testi</button>`:''}
 ${u<UN.length-1?`<button onclick="learn(${u+1})">Sonraki ünite →</button>`:''}</div>`;
}
function unitTest(u){S.u=u;startTest(UN[u].ids,`${u+1}. ünite testi`,{kind:'u',u})}
function blockTest(b){const B=BL[b];startTest(B.flatMap(u=>UN[u].ids),`Ünite ${B[0]+1}–${B[B.length-1]+1} testi`,{kind:'b',b})}
function startTest(ids,title,from){S.scope=ids;S.title=title;S.from=from;S.q=shuffle(ids);S.c={};ids.forEach(i=>S.c[i]=0);S.tries=0;S.wrong=0;next();go('test')}
// soru tipleri: 0 kanji→anlam, 1 kelime→okunuş, 2 anlam→kelime
function next(){S.cur=S.q.shift();S.ans=null;const k=K[S.cur];S.type=Math.floor(Math.random()*3);S.wi=Math.floor(Math.random()*k.w.length);
 const others=shuffle((S.scope.length>=8?S.scope:K.map((_,i)=>i)).filter(i=>i!==S.cur));
 const val=i=>{const x=K[i],w=x.w[Math.floor(Math.random()*x.w.length)];return S.type===0?x.m:S.type===1?w.r:w.w};
 const right=S.type===0?k.m:S.type===1?k.w[S.wi].r:k.w[S.wi].w;
 const set=[right];for(const i of others){const v=val(i);if(!set.includes(v))set.push(v);if(set.length===4)break}
 S.right=right;S.opts=shuffle(set)}
function pick(n){if(S.ans!==null)return;S.ans=n;S.tries++;
 if(S.opts[n]===S.right){S.c[S.cur]++;if(S.c[S.cur]<2)S.q.splice(Math.min(S.q.length,4+Math.floor(Math.random()*4)),0,S.cur)}
 else{S.wrong++;S.q.splice(Math.min(S.q.length,2),0,S.cur)}render()}
function cont(){if(!S.q.length){go('done');return}next();render();scrollTo(0,0)}
function test(){const tot=S.scope.length,m=Object.values(S.c).filter(v=>v>=2).length,k=K[S.cur],c=S.c[S.cur],w=k.w[S.wi];
 const qs=[["Bu kanjinin anlamı?",`<div class="qbig jp">${k.k}</div>`],
  ["Bu kelimenin okunuşu?",`<div class="qbig jp" style="font-size:44px">${w.w}</div>`],
  ["Hangi kelime?",`<div class="qmean">${w.m}</div>`]][S.type];
 const opts=S.opts.map((o,n)=>{let cl="";if(S.ans!==null){if(o===S.right)cl="ok";else if(n===S.ans)cl="bad"}
  return `<button class="opt ${S.type?'j':''} ${cl}" onclick="pick(${n})">${o}</button>`}).join("");
 let fb="";if(S.ans!==null){const ok=S.opts[S.ans]===S.right;
  fb=`<div class="fb ${ok?'ok':'bad'}"><div class="head">${ok?(c>=2?'Doğru — bu kanji tamam ✓':'Doğru — bir kez daha gelecek'):'Yanlış — doğrusu: '+S.right}</div>
  <span class="jp" style="font-size:26px">${k.k}</span> = <b>${k.m}</b> <span class="num jp">(${k.on} · ${k.kun})</span>
  <div class="words ${S.furi?'':'nofuri'}">${k.w.map(x=>`<div class="w"><span class="jp">${rb(x.w,x.r)}</span><span class="m">${x.m}</span></div>`).join("")}</div></div>
  <div class="navrow"><button class="pri" onclick="cont()">Devam</button></div>`}
 return hdr(S.title,tg('furi','ふりがな'))+`<div class="prog"><i style="width:${m/tot*100}%"></i></div>
 <div class="stat"><span>Tamamlanan ${m}/${tot}</span><span>Yanlış ${S.wrong}</span></div>
 <div class="card"><div class="qtype">${qs[0]}<span class="dots"><i class="${c>=1?'f':''}"></i><i class="${c>=2?'f':''}"></i></span></div>${qs[1]}
 <div class="opts">${opts}</div></div>${fb}`}
function done(){const f=S.from;let nx="";
 if(f.kind==='u'){const nb=BL.findIndex(b=>b[b.length-1]===f.u);
  nx=nb>=0?`<button class="pri" onclick="blockTest(${nb})">Ünite ${BL[nb][0]+1}–${f.u+1} genel testi</button>`:f.u<UN.length-1?`<button class="pri" onclick="learn(${f.u+1})">Sonraki ünite →</button>`:''}
 else if(f.b<BL.length-1)nx=`<button class="pri" onclick="learn(${BL[f.b+1][0]})">Sonraki ünite →</button>`;
 return `<div class="done"><div class="stamp">合格</div><h1 style="margin-top:24px">Hepsini 2 kez doğru bildin</h1>
 <p class="num">${S.tries} cevap, ${S.wrong} yanlış</p>
 <div class="navrow"><button onclick="go('home')">Menü</button><button onclick="startTest(S.scope,S.title,S.from)">Tekrar test</button>${nx}</div></div>`}
function render(){$.innerHTML=({home,study,test,done})[S.view]()}
render();
</script>
</body>
</html>
